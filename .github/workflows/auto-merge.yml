# ─────────────────────────────────────────────────────────────────────────────
# Auto-merge genérico — arma "auto-merge" en CUALQUIER PR nueva contra `main`
# apenas se abre (agente de guías, agente de otra app, o Patricio a mano).
# GitHub completa el merge solo cuando ci.yml (disparado normal por el evento
# "pull_request" de esta misma PR) queda en verde — sin gate humano, por diseño
# de este repo (agente/ESTADO.md §4: "El PR se auto-mergea solo si ci.yml pasa").
#
# NO cubre las PRs que abre growth-agent.yml (ramas growth/*): esas se crean
# con el GITHUB_TOKEN del propio workflow, que por restricción anti-recursión
# de Actions no dispara el evento "pull_request" de ESTE workflow tampoco —
# growth-agent.yml ya trae su propia solución (dispara ci.yml a mano + arma
# auto-merge en el mismo run, ver pasos 2.5 ahí). Este workflow cubre todo lo
# demás: cualquier rama abierta con un token de usuario real.
# ─────────────────────────────────────────────────────────────────────────────
name: Auto-merge PRs

# `synchronize` NO es decorativo — es lo que hace que esto sobreviva a un
# force-push. Caso real (PR #57, 2026-07-24): PR abierto 22:10:09, rebase sobre
# el main que se había movido y force-push 22:11:58. El force-push cambió el
# head SHA antes de que los runs encolados por `opened` alcanzaran a correr, y
# GitHub los descartó — no quedó ni un run de este workflow. ci.yml se recuperó
# solo porque escucha `synchronize` (no declara `types`, así que toma el default
# [opened, synchronize, reopened]); este workflow no, y el PR quedó esperando un
# click humano. Rebasar justo después de abrir un PR es lo más normal que hay.
#
# Correr en cada push es barato y seguro: `gh pr merge --auto` es idempotente
# (re-armarlo sobre un PR que ya lo tiene armado no hace nada), y este repo es
# PÚBLICO, o sea los minutos de Actions no se facturan — el mínimo de 1 minuto
# por job que sí pesa en los repos privados de este portfolio no aplica acá.
#
# `ready_for_review` cubre el otro agujero del mismo tipo: un PR abierto como
# draft no se puede auto-mergear, y al marcarlo listo NO se dispara `opened`.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Armar auto-merge (squash, se completa cuando ci.yml pase)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --auto --squash \
            --repo "${{ github.repository }}" \
            || echo "No se pudo armar auto-merge (revisar 'Allow auto-merge' del repo y branch protection de main)."
