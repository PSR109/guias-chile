# ─────────────────────────────────────────────────────────────────────────────
# CI — Guías de Chile (sitio estático, sin build step).
#
# Gates baratos y sin dependencias externas (todo Node puro bajo scripts/):
#   1. check-html.mjs           → HTML estructuralmente válido (doctype, charset,
#                                  título, etiquetas balanceadas).
#   2. check-links.mjs          → todo href/src interno resuelve a un archivo real.
#   3. check-affiliate-ids.mjs  → afiliados.js sigue con los IDs de GYG y Viator.
#   4. check-hreflang.mjs       → reciprocidad hreflang ES↔EN.
#   5. check-sitemap.mjs        → sitemap.xml es XML válido, sin DTD/entidades.
#   6. check-cta-checkout.mjs   → ningún CTA de compra apunta a un producto
#                                  muerto (404 / pasarela que no cobra) ni a un
#                                  producto en otro idioma que el de la página.
#                                  Ver trip-kits/alias-map.json.
#   7. build-tienda.mjs --check → tienda.html / en/ / pt/ siguen reflejando el
#                                  catálogo de trip-kits/gumroad-live.json. Sin
#                                  esto, publicar un producto nuevo en Gumroad lo
#                                  dejaba otra vez huérfano (el 2026-08-03 había
#                                  11 productos LIVE sin un solo enlace, entre
#                                  ellos los 5 de ticket más alto del catálogo).
#
# Este workflow es el gate que habilita el auto-merge del growth agent
# (.github/workflows/growth-agent.yml): un PR solo se mergea solo si esto
# pasa en verde. Kill switch: no hay uno propio de CI (no tiene sentido
# apagar los checks de calidad); el kill switch relevante es
# GROWTH_ENABLED=false, que apaga al agente que abre los PRs.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Sin inputs propios: growth-agent.yml la dispara con `gh workflow run ci.yml
  # --ref <rama>`, que ya fija qué rama/SHA se chequea (un PR abierto con el
  # GITHUB_TOKEN de ese workflow no dispara "pull_request" por sí solo).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: HTML válido (estructura + balance de etiquetas)
        run: node scripts/check-html.mjs
      - name: Enlaces internos sin roturas
        run: node scripts/check-links.mjs
      - name: IDs de afiliado presentes (GYG + Viator)
        run: node scripts/check-affiliate-ids.mjs
      - name: Reciprocidad hreflang ES↔EN
        run: node scripts/check-hreflang.mjs
      - name: sitemap.xml válido (sin DTD/entidades)
        run: node scripts/check-sitemap.mjs
      - name: alias-map de CTAs al día
        run: node trip-kits/build-alias-map.mjs --check
      - name: Tiendas ES/EN/PT al día con el catálogo Gumroad
        run: node scripts/build-tienda.mjs --check
      - name: Captura de correo activa donde está el popup
        run: node scripts/activar-boletin-en-pt-2026-08-03.mjs --check
      - name: CTAs de compra vivos y en el idioma de la página
        run: node scripts/check-cta-checkout.mjs
